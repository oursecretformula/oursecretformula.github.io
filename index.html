<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="description" content="A little world, made for two.">
  <meta name="theme-color" content="#f8f3ec">
  <title>Our Secret Formula</title>
  <style>
    :root { color-scheme: light; --paper: #f8f3ec; --ink: #4d3940; --rose: #81445e; --muted: #735f66; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; padding: 32px 20px; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(100%, 690px); padding: clamp(36px, 8vw, 76px) clamp(22px, 6vw, 64px); text-align: center; border: 1px solid #dac7cc; border-radius: 160px 160px 24px 24px; background: #fffdf8; box-shadow: 0 18px 70px #81445e0a; }
    .mark { color: var(--rose); font-size: 37px; line-height: 1; margin: 0 0 32px; }
    .eyebrow { margin: 0 0 20px; color: var(--rose); font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(41px, 8.5vw, 70px); font-weight: 400; line-height: 1.08; letter-spacing: -.045em; text-wrap: balance; }
    .tagline { margin: 25px 0 0; color: var(--muted); font-size: clamp(16px, 3.5vw, 19px); font-style: italic; line-height: 1.6; }
    .drops { display: flex; justify-content: center; gap: 10px; margin: 32px 0; }
    .drops span { width: 6px; height: 8px; border-radius: 55% 55% 55% 5%; background: #ae7c8b; transform: rotate(-45deg); }
    .drops span:nth-child(even) { background: #d8b7bd; }
    .invitation { margin: 0; font-size: 21px; line-height: 1.5; }
    .status { max-width: 360px; margin: 15px auto 0; font-family: system-ui, sans-serif; color: var(--muted); font-size: 14px; line-height: 1.75; text-wrap: pretty; }
    footer { margin-top: 35px; color: var(--rose); font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    @media (max-width: 360px) { body { padding: 18px 12px; } main { padding: 40px 18px; } h1 { font-size: 39px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♡</div>
    <p class="eyebrow">A little world, made for two</p>
    <h1>Our Secret<br>Formula</h1>
    <p class="tagline">Eight drops. Two hearts. One love story.</p>
    <div class="drops" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <p class="invitation">Your invitation is being prepared.</p>
    <p class="status">The private entrance will appear here when it’s ready.</p>
    <footer>Something lovely is on its way</footer>
  </main>
</body>
</html>
